name: Build Android minimal AAR

on:
  workflow_dispatch:
  push:
    branches:
      - 4.x
    paths:
      - .github/workflows/android-minimal-aar.yml
      - platforms/android/arm64-v8a-minimal.config.py
      - platforms/android/**
      - modules/java/**
      - modules/core/**
      - modules/imgproc/**
      - cmake/**
      - CMakeLists.txt

permissions:
  contents: read

concurrency:
  group: android-minimal-aar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: arm64-v8a java/core/imgproc
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      OPENCV_VERSION: 4.13.0
      ANDROID_COMPILE_SDK: 35
      ANDROID_BUILD_TOOLS: 35.0.0
      ANDROID_NDK_VERSION: 27.2.12479018
      OPENCV_BUILD_DIR: ${{ github.workspace }}/build-android
      OPENCV_SDK_DIR: ${{ github.workspace }}/build-android/OpenCV-android-sdk
      OPENCV_GRADLE_VERBOSE_OPTIONS: --no-daemon --stacktrace

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_SDK=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ant ninja-build ccache

      - name: Patch SDK script and Java sources for minimal build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          sdk_script = Path("platforms/android/build_sdk.py")
          text = sdk_script.read_text()
          text = text.replace(
              "        if do_install:\n            build_targets.append(\"opencv_tests\")\n",
              "        if do_install and not self.no_samples_build:\n            build_targets.append(\"opencv_tests\")\n",
          )
          text = text.replace("if abi.haveKleidiCV():", "if False and abi.haveKleidiCV():")
          sdk_script.write_text(text)

          native_camera = Path("modules/java/generator/android-24/java/org/opencv/android/NativeCameraView.java")
          native_camera.unlink()

          utils = Path("modules/java/generator/android/java/org/opencv/android/Utils.java")
          text = utils.read_text()
          text = text.replace("import org.opencv.imgcodecs.Imgcodecs;\n", "")
          text = text.replace("import java.io.ByteArrayOutputStream;\n", "")
          def remove_java_method(source, signature):
              start = source.index("\n    " + signature)
              brace = source.index("{", start)
              depth = 0
              end = brace
              while end < len(source):
                  if source[end] == "{":
                      depth += 1
                  elif source[end] == "}":
                      depth -= 1
                      if depth == 0:
                          end += 1
                          if end < len(source) and source[end] == "\n":
                              end += 1
                          return source[:start] + "\n" + source[end:]
                  end += 1
              raise RuntimeError(f"Method not closed: {signature}")

          text = remove_java_method(
              text,
              "public static Mat loadResource(Context context, int resourceId) throws IOException",
          )
          text = remove_java_method(
              text,
              "public static Mat loadResource(Context context, int resourceId, int flags) throws IOException",
          )
          utils.write_text(text)
          PY

      - name: Build minimal OpenCV Android SDK
        run: |
          python3 platforms/android/build_sdk.py \
            "${OPENCV_BUILD_DIR}" \
            "${GITHUB_WORKSPACE}" \
            --sdk_path "${ANDROID_SDK}" \
            --ndk_path "${ANDROID_NDK}" \
            --config "${GITHUB_WORKSPACE}/platforms/android/arm64-v8a-minimal.config.py" \
            --modules_list core,imgproc,java,java_bindings_generator \
            --no_samples_build \
            --no_media_ndk \
            --disable TBB \
            --disable OPENMP \
            --disable IPP \
            --disable ITT \
            --disable EIGEN \
            --disable ADE \
            --disable PROTOBUF \
            --disable QUIRC \
            --disable JPEG \
            --disable PNG \
            --disable TIFF \
            --disable WEBP \
            --disable OPENJPEG \
            --disable JASPER \
            --disable OPENEXR \
            --disable FFMPEG \
            --disable GSTREAMER \
            --disable V4L \
            --disable KLEIDICV

      - name: Verify OpenCV native dependencies are bundled
        run: |
          readelf -d "${OPENCV_SDK_DIR}/sdk/native/libs/arm64-v8a/libopencv_java4.so"
          if readelf -d "${OPENCV_SDK_DIR}/sdk/native/libs/arm64-v8a/libopencv_java4.so" | grep -E 'libopencv_(core|imgproc)\.so'; then
            echo "libopencv_java4.so still depends on separate OpenCV module libraries" >&2
            exit 1
          fi

      - name: Build Maven AAR
        run: |
          python3 platforms/android/build_java_shared_aar.py \
            "${OPENCV_SDK_DIR}" \
            --android_compile_sdk "${ANDROID_COMPILE_SDK}" \
            --android_min_sdk 23 \
            --android_target_sdk 35 \
            --ndk_location "${ANDROID_NDK}"

      - name: Print output sizes
        run: |
          find "${OPENCV_SDK_DIR}" -name 'libopencv_java4.so' -print -exec ls -lh {} \;
          find outputs -type f -print -exec ls -lh {} \;

      - name: Upload AAR and SDK library
        uses: actions/upload-artifact@v4
        with:
          name: opencv-android-minimal-${{ env.OPENCV_VERSION }}-arm64-v8a
          if-no-files-found: error
          path: |
            outputs/**/*.aar
            outputs/maven_repo/**
            ${{ env.OPENCV_SDK_DIR }}/sdk/native/libs/arm64-v8a/libopencv_java4.so
